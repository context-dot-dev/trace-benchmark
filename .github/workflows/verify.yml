name: Verify TRACE
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements-lock.txt
      - run: npm run build
      - run: PYTHONPATH=. python scripts/verify-railway.py
      - run: docker build -t trace-benchmark .
      - run: docker run --rm --entrypoint python -e PYTHONPATH=/app -v "$PWD/scripts:/proof:ro" -v "$PWD/artifacts/railway:/app/artifacts/railway" trace-benchmark /proof/verify-railway.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: railway-runtime-proof
          path: artifacts/railway/
